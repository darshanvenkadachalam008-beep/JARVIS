<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>J.A.R.V.I.S — INTRUSION DETECTED</title>
<style>
  :root{
    --red:#ff1d1d;
    --red-dim:#7a0000;
    --bg:#060001;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:'Courier New',monospace;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    position:relative;
  }

  /* pulsing red background wash */
  .bgwash{
    position:fixed;inset:0;
    background:radial-gradient(circle at 50% 50%, rgba(122,0,0,0.55) 0%, rgba(6,0,1,1) 72%);
    animation:wash 1.4s ease-in-out infinite;
    z-index:0;
  }
  @keyframes wash{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.35); }
  }

  /* hexagon grid texture */
  .hexgrid{
    position:fixed;inset:0;
    z-index:1;
    opacity:0.18;
    background-image:
      repeating-linear-gradient(60deg, transparent 0 38px, var(--red) 38px 39px),
      repeating-linear-gradient(-60deg, transparent 0 38px, var(--red) 38px 39px),
      repeating-linear-gradient(0deg, transparent 0 38px, var(--red) 38px 39px);
    mix-blend-mode:screen;
  }

  /* scattered DANGER labels */
  .scatter{
    position:fixed;inset:0;z-index:2;pointer-events:none;
  }
  .scatter span{
    position:absolute;
    color:var(--red);
    font-weight:700;
    letter-spacing:2px;
    opacity:0.55;
    text-shadow:0 0 8px var(--red);
    animation:flick 1.1s steps(2) infinite;
  }
  @keyframes flick{ 50%{opacity:0.12;} }

  /* radar rings + skull center */
  .core{
    position:relative;z-index:3;
    width:min(78vw, 420px);
    aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;
  }
  .ring{
    position:absolute;
    border:2px solid var(--red);
    border-radius:50%;
    opacity:0.0;
    animation:ringpulse 2s ease-out infinite;
  }
  .ring.r1{width:35%;height:35%;animation-delay:0s;}
  .ring.r2{width:60%;height:60%;animation-delay:0.4s;}
  .ring.r3{width:85%;height:85%;animation-delay:0.8s;}
  .ring.r4{width:100%;height:100%;animation-delay:1.2s;}
  @keyframes ringpulse{
    0%{ transform:scale(0.7); opacity:0.9; box-shadow:0 0 18px var(--red);}
    100%{ transform:scale(1.05); opacity:0; }
  }

  .dial{
    position:absolute;width:100%;height:100%;
    border:1px dashed rgba(255,40,40,0.5);
    border-radius:50%;
    animation:spin 6s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .skullbox{
    position:relative;z-index:4;
    width:42%;
    display:flex;flex-direction:column;align-items:center;
    animation:shake 0.18s linear infinite;
  }
  @keyframes shake{
    0%,100%{ transform:translate(0,0); }
    25%{ transform:translate(-1px,1px); }
    50%{ transform:translate(1px,-1px); }
    75%{ transform:translate(-1px,-1px); }
  }
  .skullbox svg{ width:100%; filter:drop-shadow(0 0 16px var(--red)); }

  .title-wrap{
    position:relative;z-index:3;
    margin-top:6vh;
    text-align:center;
  }
  h1{
    color:var(--red);
    font-size:clamp(28px, 8vw, 52px);
    letter-spacing:6px;
    text-shadow:0 0 14px var(--red), 0 0 30px var(--red);
    animation:flash 0.6s steps(2) infinite;
  }
  @keyframes flash{ 50%{ opacity:0.25; } }

  .meta{
    margin-top:18px;
    color:#ffb3b3;
    font-size:clamp(13px, 3.6vw, 17px);
    line-height:1.7;
    text-align:left;
    display:inline-block;
    border:1px solid rgba(255,40,40,0.6);
    padding:14px 20px;
    background:rgba(122,0,0,0.18);
    border-radius:4px;
    backdrop-filter:blur(2px);
  }
  .meta b{ color:#fff; }
  .meta .label{ color:#ff6b6b; display:inline-block; width:96px; }

  .footer{
    position:absolute; bottom:5vh; left:0; right:0;
    text-align:center; z-index:3;
    color:rgba(255,150,150,0.7);
    font-size:12px; letter-spacing:3px;
  }

  .tap-hint{
    position:absolute; top:4vh; left:0; right:0;
    text-align:center; z-index:5;
    color:rgba(255,255,255,0.55);
    font-size:11px; letter-spacing:2px;
  }

  /* mute toggle */
  .mute-btn{
    position:absolute; top:4vh; right:5vw; z-index:6;
    background:rgba(0,0,0,0.4); border:1px solid var(--red);
    color:var(--red); border-radius:50%;
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
</style>
</head>
<body>

  <div class="bgwash"></div>
  <div class="hexgrid"></div>
  <div class="scatter" id="scatter"></div>

  <button class="mute-btn" id="muteBtn" aria-label="Mute alarm">&#128263;</button>
  <div class="tap-hint" id="tapHint">TAP ANYWHERE TO ENABLE ALARM</div>

  <div style="position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;">
    <div class="core">
      <div class="dial"></div>
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="ring r4"></div>
      <div class="skullbox">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <rect x="14" y="58" width="72" height="30" rx="3" fill="none" stroke="#ff1d1d" stroke-width="3"/>
          <rect x="8" y="88" width="84" height="6" rx="2" fill="#ff1d1d"/>
          <circle cx="50" cy="42" r="22" fill="none" stroke="#ff1d1d" stroke-width="3"/>
          <circle cx="42" cy="40" r="5" fill="#ff1d1d"/>
          <circle cx="58" cy="40" r="5" fill="#ff1d1d"/>
          <path d="M42 54 L46 60 L50 54 L54 60 L58 54" fill="none" stroke="#ff1d1d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M30 62 L20 78 M70 62 L80 78" stroke="#ff1d1d" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="title-wrap">
      <h1>DANGER</h1>
      <div class="meta" id="metaBox">
        <div><span class="label">MACHINE</span><b id="mMachine">—</b></div>
        <div><span class="label">TIME</span><b id="mTime">—</b></div>
        <div><span class="label">STATUS</span><b style="color:#ff4d4d;">INTRUSION</b></div>
        <div><span class="label">THREAT</span><b style="color:#ff4d4d;">HIGH</b></div>
      </div>
      <div id="photoBox" style="display:none;margin-top:14px;text-align:center;">
        <div style="font-size:11px;letter-spacing:2px;color:#ff8080;margin-bottom:6px;">
          CAPTURED AT KEYBOARD</div>
        <img id="intruderPhoto" src="" alt="Captured photo"
             style="max-width:240px;width:80vw;border:2px solid #ff4d4d;
                    border-radius:4px;box-shadow:0 0 24px rgba(255,77,77,.5);" />
      </div>
    </div>
  </div>

  <div class="footer">J.A.R.V.I.S &nbsp;|&nbsp; MARK-XXXIX-OR SECURITY SYSTEM</div>

<script>
  // ---- Populate machine/time from query string ----
  const qs = new URLSearchParams(location.search);
  document.getElementById('mMachine').textContent = qs.get('machine') || 'UNKNOWN';
  document.getElementById('mTime').textContent    = qs.get('time') || new Date().toLocaleTimeString();

  // ---- Load the webcam/screenshot captured at the moment of the failed
  //      login, if one exists (silently stays hidden if not — a 204
  //      response means the watcher couldn't get a shot this time). ----
  (function loadIntruderPhoto() {
    const img = document.getElementById('intruderPhoto');
    const box = document.getElementById('photoBox');
    img.onload = () => { box.style.display = 'block'; };
    img.onerror = () => { box.style.display = 'none'; };
    img.src = '/alert/latest.jpg?t=' + Date.now();
  })();

  // ---- Scatter DANGER labels around the screen ----
  const scatter = document.getElementById('scatter');
  const positions = [
    {top:'6%', left:'4%'}, {top:'10%', left:'78%'}, {top:'30%', left:'2%'},
    {top:'28%', left:'85%'}, {top:'55%', left:'88%'}, {top:'60%', left:'1%'},
    {top:'80%', left:'10%'}, {top:'85%', left:'72%'}, {top:'2%', left:'42%'}
  ];
  positions.forEach((p, i) => {
    const s = document.createElement('span');
    s.textContent = 'DANGER';
    s.style.top = p.top; s.style.left = p.left;
    s.style.fontSize = (10 + (i % 3) * 3) + 'px';
    s.style.animationDelay = (i * 0.07) + 's';
    scatter.appendChild(s);
  });

  // ---- Vibration pattern (if supported) ----
  if (navigator.vibrate) {
    navigator.vibrate([300, 120, 300, 120, 300, 120, 600]);
  }

  // ---- Hacker-alarm beep: autoplay attempt, repeats with a short gap ----
  // (A short clip needs an explicit repeat-with-gap loop rather than
  // audio.loop=true, which would just stutter the clip back-to-back.)
  const audio = new Audio('/sounds/jarvis_alert.mp3');
  audio.volume = 1.0;
  const tapHint = document.getElementById('tapHint');
  const muteBtn = document.getElementById('muteBtn');
  let muted = false;
  let beepTimer = null;

  function playBeepOnce(){
    audio.currentTime = 0;
    return audio.play();
  }

  function startBeepLoop(){
    playBeepOnce().then(() => {
      tapHint.style.display = 'none';
    }).catch(() => {
      tapHint.style.display = 'block';
    });
    if (beepTimer) clearInterval(beepTimer);
    beepTimer = setInterval(() => {
      if (!muted) playBeepOnce().catch(() => {});
    }, 900);
  }
  startBeepLoop();

  document.body.addEventListener('click', () => {
    if (!muted) startBeepLoop();
  }, { once: false });

  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    if (muted) {
      audio.pause();
      if (beepTimer) clearInterval(beepTimer);
      muteBtn.textContent = '\u{1F507}';
    } else {
      muteBtn.textContent = '\u{1F50A}';
      startBeepLoop();
    }
  });

  // Re-trigger a short vibration pulse in sync with each beep repeat
  let vibeTimer = setInterval(() => {
    if (!muted && navigator.vibrate) navigator.vibrate([150, 60, 150]);
  }, 900);
</script>
</body>
</html>
