name: Security & Test CI Gate

"on":
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-and-verify:
    name: Run Full Security Test Suite & Integrity Gate
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Full Security Test Suite
        id: run_tests
        shell: cmd
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=pytest-results.xml > pytest_stdout.log 2>&1
          type pytest_stdout.log
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%

      - name: Generate Security Status Dashboard
        if: always()
        run: |
          python -m core.security_status

      - name: Upload Pytest Log and Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-execution-logs
          path: |
            pytest_stdout.log
            pytest-results.xml
          if-no-files-found: ignore

      - name: Upload Security Dashboard Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-dashboard-report
          path: memory/security_dashboard.html
          if-no-files-found: ignore

      - name: Publish Test Summary
        if: always()
        run: |
          echo "## Security Gate Execution Summary" >> $env:GITHUB_STEP_SUMMARY
          echo "* **Platform**: Windows Server (windows-latest)" >> $env:GITHUB_STEP_SUMMARY
          echo "* **Python Version**: 3.10" >> $env:GITHUB_STEP_SUMMARY
          echo "* **Gate Status**: ${{ steps.run_tests.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path pytest-results.xml) {
              [xml]$xml = Get-Content pytest-results.xml
              $suite = $xml.'testsuites'.'testsuite'
              if (-not $suite) { $suite = $xml.'testsuite' }
              echo "* **Total Tests**: $($suite.tests)" >> $env:GITHUB_STEP_SUMMARY
              echo "* **Failures**: $($suite.failures)" >> $env:GITHUB_STEP_SUMMARY
              echo "* **Errors**: $($suite.errors)" >> $env:GITHUB_STEP_SUMMARY
              echo "* **Time**: $($suite.time)s" >> $env:GITHUB_STEP_SUMMARY
              if ([int]$suite.failures -gt 0 -or [int]$suite.errors -gt 0) {
                  echo "### Failure Details" >> $env:GITHUB_STEP_SUMMARY
                  foreach ($case in $suite.testcase) {
                      if ($case.failure) {
                          echo "#### ❌ $($case.name) ($($case.classname))" >> $env:GITHUB_STEP_SUMMARY
                          echo '```' >> $env:GITHUB_STEP_SUMMARY
                          echo $case.failure.'#text' >> $env:GITHUB_STEP_SUMMARY
                          echo '```' >> $env:GITHUB_STEP_SUMMARY
                      }
                      if ($case.error) {
                          echo "#### ⚠️ ERROR: $($case.name) ($($case.classname))" >> $env:GITHUB_STEP_SUMMARY
                          echo '```' >> $env:GITHUB_STEP_SUMMARY
                          echo $case.error.'#text' >> $env:GITHUB_STEP_SUMMARY
                          echo '```' >> $env:GITHUB_STEP_SUMMARY
                      }
                  }
              }
          }
